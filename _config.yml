# snu-hyke.github.io — GitHub Pages (organization site)
# Migrated from WordPress (hyke.snu.ac.kr) export 2026-08-05.

title: "HYKE-Hwarang Research Group"
description: "Department of Mathematical Sciences, Seoul National University"
lang: ko-KR

# Organization site => served at the domain root.
url: "https://snu-hyke.github.io"
baseurl: ""

collections:
  pages:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Posts keep the date-based permalink recorded in url-redirect-map.csv.
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Keep migration inputs and reports out of the built site.
exclude:
  - "*.xml"
  - uploads/
  - scripts/
  - reports/
  - logs/
  - README.md
  - Gemfile
  - Gemfile.lock

# The workshop mini-sites are pre-built static HTML: copy them verbatim.
keep_files:
  - workshop
include:
  - workshop
