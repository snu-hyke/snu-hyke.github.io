- t: "2022 Workshop on the Dynamics of Complex Systems"
  u: "/workshop/2022/home/"
  k: "workshop"
  b: "June 27, 2022 June 27, 2022, 14:00 - 14:25 Yong-Hoon Lee (Department of Mathematics, Pusan National University) Title : A constructive approach about the existence of positive solutions for Minkowski curvature problems Abstract: In this paper, we give an existence theorem about positive solutions for the Dirichlet boundary value problem of one dimensional Minkowski curvature equations. We apply the theorem to one parameter family of problems to investigate a constructive method for numerical range of parameters where positive solutions exist. Moreover, we establish a nonexistence theorem of positive solutions for the corresponding one parameter family of problems. The coefficient function may be singular at the boundary and nonlinear term satisfies a sublinear growth condition. Main argument for the proof of existence theorem is employed by Krasnoselskii's theorem of cone expansion and compression. We give a numerical algorithm and various examples to illustrate numerical information about ranges of the existence and nonexistence parameters which have been given only in a theoretical manner so far. June 27, 2022, 14:25 - 14:50 Minkyu Kwak (Department of Mathematics, Chonnam National University) Title : A remark on the existence of an inertial manifold Abstract: The inertial manifold theory has been developed in the mid- 80's. However, the theory, even after enormous efforts, does not apply to the Navier-Stokes equations simply because the spectral gap condition is not satisfied. Here we focus on backward bounded (in time) solutions for the system and introduce a new insight to relax the gap condition. June 27, 2022, 15:00 - 15:25 Jongmin Han (Department of Mathematics, Kyung Hee University) Title : Asymptotics for $n$-component Ginzburg-Landau vortices Abstract: Let $\\Omega \\subset \\mathbb{R}^2$ be a smooth bounded simply connected domain. In this talk, we consider the $n$-component Ginzburg-Landau equations on $\\Omega $: \\[ \\left\\{ \\begin{aligned} -\\Delta u_i& = \\frac{1}{\\varepsilon^2} u_i \\Big(n-\\sum_{j=1}^n |u_j|^2\\Big) \\quad \\text{in}\\quad \\Omega,\\\\ u_i&=g_i \\quad \\text{on}\\quad \\partial \\Omega, \\end{aligned} \\right. \\] for each $i=1,\\cdots,n$. Here, $u_1,\\cdots,u_n:\\Omega \\to \\mathbb{R}^2$, and $g_1, \\cdots, g_n : \\partial \\Omega \\to S^1 $ are smooth maps such that \\[ \\text{deg} (g_j,\\partial\\Omega)=d_j \\in \\mathbb{N}\\cup\\{0\\} \\quad \\text{for}\\quad j=1,\\cdots, n. \\] We study the asymptotic behavior of minimizers $(u_{1,\\varepsilon},\\cdots,u_{n,\\varepsilon})$ for the energy functional \\[ E_{\\varepsilon,\\Omega} (u_1,\\cdots,u_n) = \\frac12 \\int_\\Omega \\sum_{j=1}^n |\\nabla u_j|^2 dx + \\frac{1}{4\\varepsilon^2} \\int_\\Omega \\Big(n-\\sum_{j=1}^n |u_j|^2\\Big)^2 dx \\] on $H^1_{g_1} (\\Omega,\\mathbb{R}^2) \\times \\cdots\\times H^1_{g_n}(\\Omega,\\mathbb{R}^2)$. We prove that the minimizers converges locally in any $C^k$-norm to a solution $( u_1^*,\\cdots, u_n^*)$ of a system of generalized harmonic map equations \\[ \\left\\{ \\begin{aligned} -\\Delta u_j& = \\frac{1}{n}u_j \\sum_{k=1}^n |\\nabla u_k|^2 \\quad \\text{in}\\quad \\Omega, \\\\ u_j&=g_j \\quad \\text{on}\\quad \\partial \\Omega,\\\\ \\sum_{j=1}^n|u_j|^2 &=n \\quad \\text{in}\\quad \\Omega. \\end{aligned}\\right. \\] June 27, 2022, 15:25 - 15:50 Sang-Il Han (Korea University of Technology) Title : Affinity maturation of Covid 19 Spike protein and Ace2 Abstract: In order to respond to pandemic Covid 19, which has spread worldwide after 2020, mankind is responding by developing mRNA Vaccine and therapeutics. Vaccines are treated enhancing the human immune system, and the therapeutics are structured to treat by interfering with the replication of the virus. All of these methods are performed after the virus infects the cells. However, since Covid 19 is a structure that infects lung cells by reacting with spike protein and Ace2, it will be useful to accurately identify the reaction between the two proteins. Therefore, this study aims to investigate the phenomenon that affinity maturation occurs in quantum chem"
